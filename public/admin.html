<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%82%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <title>Admin - SaltMarket</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="site-header"></div>

  <main>
    <h1>Manage Products</h1>
    <p class="page-subtitle">Admin only. Add, edit, or remove products from the catalog.</p>

    <div id="admin-denied" data-testid="admin-denied" hidden>
      <p class="error-text" data-testid="admin-denied-message">You need admin access to view this page.</p>
      <p><a href="/login.html">Go to login</a> (admin test account: <code>admin@saltmarket.com</code> / <code>admin123</code>)</p>
    </div>

    <div id="admin-content" hidden>
      <h2>Add a product</h2>
      <form id="admin-add-form" data-testid="admin-add-form">
        <div class="admin-form-grid">
          <label>Name
            <input name="name" type="text" data-testid="admin-add-name" />
          </label>
          <label>Category
            <input name="category" type="text" data-testid="admin-add-category" placeholder="e.g. Gourmet" />
          </label>
          <label>Price (USD)
            <input name="price" type="number" step="0.01" min="0" data-testid="admin-add-price" />
          </label>
          <label>Stock
            <input name="stock" type="number" step="1" min="0" data-testid="admin-add-stock" />
          </label>
          <label>Unit
            <input name="unit" type="text" data-testid="admin-add-unit" placeholder="e.g. 200g jar" />
          </label>
          <label>Emoji
            <input name="emoji" type="text" data-testid="admin-add-emoji" placeholder="🧂" />
          </label>
        </div>
        <label>Description
          <input name="description" type="text" data-testid="admin-add-description" />
        </label>
        <p class="error-text" id="admin-add-error" data-testid="admin-add-error" hidden></p>
        <p class="success-text" id="admin-add-success" data-testid="admin-add-success" hidden>Product added.</p>
        <button type="submit" id="admin-add-submit" data-testid="admin-add-submit">Add product</button>
      </form>

      <h2 style="margin-top:2rem;">Catalog</h2>
      <p class="error-text" id="admin-table-error" data-testid="admin-table-error" hidden></p>
      <table class="cart-table" id="admin-product-table" data-testid="admin-product-table">
        <thead>
          <tr>
            <th></th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th>Unit</th><th></th>
          </tr>
        </thead>
        <tbody id="admin-product-rows"></tbody>
      </table>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%82%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <title>Login - SaltMarket</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="site-header"></div>

  <main>
    <div class="auth-card">
      <h1>Welcome back</h1>
      <p class="info-text" id="login-notice" data-testid="login-notice" hidden>Please login to view your cart.</p>
      <form id="login-form" class="stacked" novalidate>
        <label>Email
          <input name="email" type="email" data-testid="login-email" />
        </label>
        <label>Password
          <input name="password" type="password" data-testid="login-password" />
        </label>
        <p class="error-text" id="login-error" data-testid="login-error" hidden></p>
        <button type="submit" id="login-submit" data-testid="login-submit">Login</button>
      </form>
      <p class="auth-footer">No account? <a href="/register.html" data-testid="go-to-register">Register</a></p>
      <p class="auth-hint">Test account: <code>test@saltmarket.com</code> / <code>password123</code></p>
      <p class="auth-hint">Admin account: <code>admin@saltmarket.com</code> / <code>admin123</code></p>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/login.js"></script>
</body>
</html>

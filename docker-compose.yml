services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: saltmarket
      POSTGRES_USER: saltmarket
      POSTGRES_PASSWORD: saltmarket
    ports:
      - "5432:5432"
    volumes:
      - saltmarket_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saltmarket"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  saltmarket_pgdata:
